name: Temporary surface research button

on:
  push:
    branches:
      - agent/manual-research-function-limit-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-research-function-limit-fix
      - name: Add visible research control and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/cloud/api/operator/index.ts')
          text = path.read_text()
          old = '</header><section class="stats">'
          new = '</header><section class="push-panel"><div><h2>Research controls</h2><p>Run an additional governed research cycle without changing the scheduled cadence.</p></div><div class="push-actions"><a class="button" href="/api/operator/research-now">Run Research Now</a></div></section><section class="stats">'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one operator header insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/temporary_surface_research_button.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/cloud/api/operator/index.ts .github/workflows/temporary_surface_research_button.yml
          git commit -m "Show Run Research Now in operator workspace"
          git push origin HEAD:agent/manual-research-function-limit-fix
