name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Lint WordPress PHP
        run: find plugins/wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package WordPress plugin
        run: bash scripts/package-wordpress.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neo-authority-engine-wordpress-v1.4.0
          path: dist/neo-authority-engine-v1.4.0.zip
          if-no-files-found: error
